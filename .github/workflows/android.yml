name: Build Android app

on:
  push:
    paths: ['android/**', 'web/quotes.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DailySunshine.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DailySunshine-apk
          path: DailySunshine.apk

      # On the default branch, publish the APK as a GitHub Release so it can be downloaded
      # straight onto a phone from .../releases/latest
      - name: Publish release
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Daily Sunshine for Android 1.0.${{ github.run_number }}
          body: |
            Download **DailySunshine.apk** on your Android phone and open it to install
            (you may need to allow "Install unknown apps" for your browser).
            Then long-press your home screen → Widgets → Daily Sunshine.
          files: DailySunshine.apk
          make_latest: true
