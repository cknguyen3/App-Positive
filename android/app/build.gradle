plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dailysunshine.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dailysunshine.app'
        minSdk 26
        targetSdk 35
        versionCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName = "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    // A fixed debug key (committed on purpose) so each new APK installs as an
    // update over the previous one instead of needing an uninstall first.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The messages live in one place (web/quotes.json) and are shared by
    // the web app, the iOS widget and this Android app.
    sourceSets {
        main.assets.srcDir("$buildDir/generated/quoteAssets")
    }
}

def copyQuotes = tasks.register('copyQuotes', Copy) {
    from rootProject.file('../web/quotes.json')
    into "$buildDir/generated/quoteAssets"
}
tasks.named('preBuild') { dependsOn copyQuotes }
